<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive 3D SVG Logo - Emissive Rain</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      let scene, camera, renderer, controls;
      let logoGroup;
      let composer;
      let bloomPass; // Keep a reference to bloomPass for resizing

      // --- Rain Variables ---
      const raindrops = [];
      const numRaindrops = 200; // Number of raindrops
      const rainArea = { width: 60, depth: 60, topY: 40, bottomY: -30 };
      let sharedRaindropGeometry;
      let sharedRaindropMaterial;

      const mainLogoSvgData = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112.5 26.539">
            <path
                d="M150.677,8.741c0,4.113-2.719,5.965-7.8,5.965-.933.009-1.636,0-2.27-.018a1.687,1.687,0,0,0-.867.216c-2.824,1.469-4.782,1.408-4.984,1.2-.339-.339.537-.977.981-1.443.563-.594.629-.831.4-1.117-.044-.053-.141-.141-.224-.22a6.022,6.022,0,0,1-1.8-4.553c0-4.113,2.6-6.462,7.87-6.462h.831C145.2,2.319,150.677,3.084,150.677,8.741Zm-7.58,2.78c2.345,0,3.141-1.117,3.141-3,0-1.768-.9-3-3.141-3h-1.408c-2.2,0-3.106,1.227-3.106,3,0,1.878.8,3,3.106,3Z"
                fill="currentColor" transform="translate(-76.21, -2.31)"></path>
            <g transform="translate(0 0.77)">
                <path
                    d="M10.1,21.647c-6.079,0-7.606-2.886-7.606-7.131V11.191C2.49,6.946,4.016,4.06,10.1,4.06h.783c6.079,0,7.606,2.886,7.606,7.131v3.326c0,4.245-1.526,7.131-7.606,7.131Zm4.007-11c0-2.345-.783-3.295-3.532-3.295H10.4c-2.749,0-3.532.95-3.532,3.295v4.412c0,2.345.783,3.295,3.532,3.295h.172c2.749,0,3.532-.95,3.532-3.295Z"
                    transform="translate(-2.49 -4.06)" fill="currentColor"></path>
                <path
                    d="M56.846,21.6l-4.122-5.886L48.6,21.6a.3.3,0,0,1-.246.128H44.089a.3.3,0,0,1-.238-.479l6.189-8.112-6.079-7.9A.3.3,0,0,1,44.2,4.75h4.3a.306.306,0,0,1,.246.128l3.985,5.679,3.985-5.679a.3.3,0,0,1,.246-.128h4.3a.3.3,0,0,1,.238.479l-6.088,7.909,6.22,8.112a.3.3,0,0,1-.238.479h-4.3A.319.319,0,0,1,56.846,21.6Z"
                    transform="translate(-25.622 -4.446)" fill="currentColor"></path>
                <path
                    d="M91.254,27.039a.3.3,0,0,1,.216-.365c2.688-.717,3.942-1.821,4.6-3.625l.475-1.324h-.981a.306.306,0,0,1-.282-.194L89.125,5.149a.3.3,0,0,1,.282-.4h4.082a.306.306,0,0,1,.282.194l4.205,11.429,4.276-11.433a.3.3,0,0,1,.282-.194h4.047a.3.3,0,0,1,.277.4l-6.876,18.2c-1.3,3.4-2.631,5.424-7.659,6.62a.3.3,0,0,1-.361-.216Z"
                    transform="translate(-51.003 -4.441)" fill="currentColor"></path>
                <path
                    d="M141.555,36.55h2.032c3.634,0,6.722,1.39,6.722,5.332,0,4.175-3.295,6.145-8.93,6.145h-1.764c-4.922,0-7.5-1.8-7.5-4.856V43c.035-1.526.59-4.21,3.013-5.376C136.667,36.748,139.184,36.55,141.555,36.55Zm.2,8.288c2.785,0,4.381-.783,4.381-2.785,0-1.8-1.051-2.345-3.088-2.345h-4.21a2.548,2.548,0,0,0-2.547,2.582v.2c0,1.562,1.359,2.345,3.906,2.345Z"
                    transform="translate(-75.09 -22.258)" fill="currentColor"></path>
                <path
                    d="M194.429,20.046a.3.3,0,0,1-.185.374,27.894,27.894,0,0,1-8.147,1.227c-4.72,0-7.2-1.6-7.2-6.247V10.817c0-4.245,2.107-6.757,7.166-6.757h1.359c4.958,0,7.065,2.512,7.065,6.792v2.859a.3.3,0,0,1-.3.3H183.286v1.46c0,1.971.783,2.683,2.956,2.683a26.576,26.576,0,0,0,6.955-.972.3.3,0,0,1,.365.194ZM190.1,10c0-1.834-.849-2.613-3.057-2.613H186.4c-2.208,0-3.123.783-3.123,2.613v1.153H190.1V10Z"
                    transform="translate(-101.297 -4.06)" fill="currentColor"></path>
                <path
                    d="M234.4,21.339a.3.3,0,0,1-.3-.3V10.509c0-1.764-.339-2.956-2.239-2.956a15.158,15.158,0,0,0-4.518,1.122V21.04a.3.3,0,0,1-.3.3h-3.783a.3.3,0,0,1-.3-.3V4.663a.3.3,0,0,1,.3-.3H226a.3.3,0,0,1,.268.172l.5,1.051A14.541,14.541,0,0,1,232.7,4.06c4.447,0,5.771,2.648,5.771,5.978V21.049a.3.3,0,0,1-.3.3H234.4Z"
                    transform="translate(-125.975 -4.06)" fill="currentColor"></path>
            </g>
        </svg>
        `;

      const raindropSvgData = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24.467 12.384">
            <path d="M150.677,8.741c0,4.113-2.719,5.965-7.8,5.965-.933.009-1.636,0-2.27-.018a1.687,1.687,0,0,0-.867.216c-2.824,1.469-4.782,1.408-4.984,1.2-.339-.339.537-.977.981-1.443.563-.594.629-.831.4-1.117-.044-.053-.141-.141-.224-.22a6.022,6.022,0,0,1-1.8-4.553c0-4.113,2.6-6.462,7.87-6.462h.831C145.2,2.319,150.677,3.084,150.677,8.741Zm-7.58,2.78c2.345,0,3.141-1.117,3.141-3,0-1.768-.9-3-3.141-3h-1.408c-2.2,0-3.106,1.227-3.106,3,0,1.878.8,3,3.106,3Z" fill="currentColor" transform="translate(-126.21 -2.31)"/>
        </svg>
      `;
      // Note: I adjusted the viewBox and transform for the raindrop SVG to be roughly centered around its own origin
      // viewBox="0 0 width height" where width/height are from the path's bounding box.
      // transform="translate(-minX, -minY)"

      init();

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7e44eb);

        camera = new THREE.PerspectiveCamera(
          50,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.set(-5, -11, 35); // Slightly adjusted camera for rain view

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.0;

        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
        scene.add(ambientLight);

        // --- POST-PROCESSING SETUP (BLOOM) ---
        const renderScene = new RenderPass(scene, camera);
        bloomPass = new UnrealBloomPass( // Assign to global bloomPass
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          0.7,
          0.3,
          0.75 // strength, radius, threshold (adjusted threshold)
        );

        composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 5;
        controls.maxDistance = 100;
        controls.target.set(0, 0, 0);

        // --- DEFINE SHARED MATERIAL FOR LOGO AND RAINDROPS ---
        sharedRaindropMaterial = new THREE.MeshStandardMaterial({
          color: 0xff7c87,
          emissive: 0xffb0b7,
          emissiveIntensity: 1.5, // Increased intensity a bit
          metalness: 0.0,
          roughness: 0.5,
          side: THREE.DoubleSide,
        });

        loadMainLogo();
        createRaindropGeometryAndSystem(); // Create geometry once, then particles

        window.addEventListener("resize", onWindowResize, false);
        animate();
      }

      function loadMainLogo() {
        const loader = new SVGLoader();
        const parsedSVG = loader.parse(mainLogoSvgData);
        logoGroup = new THREE.Group();

        const extrudeSettings = {
          depth: 1.5,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.08,
          bevelThickness: 0.08,
        };

        parsedSVG.paths.forEach((path) => {
          const shapes = SVGLoader.createShapes(path);
          shapes.forEach((shape) => {
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.computeVertexNormals();
            const mesh = new THREE.Mesh(geometry, sharedRaindropMaterial);
            logoGroup.add(mesh);
          });
        });

        // Initial centering and scaling (without Y-flip yet)
        centerAndScaleObject(logoGroup, 20, false); // false for centerGeometry for the group

        // --- APPLY Y-FLIP TO THE MAIN LOGO GROUP ---
        logoGroup.scale.y *= -1;

        // --- RE-CENTER AFTER Y-FLIP (OPTIONAL BUT RECOMMENDED FOR PERFECT CENTERING) ---
        // The Y-flip might slightly shift the perceived center if the object isn't perfectly symmetrical along X after flip.
        // Re-calculating the bounding box and re-centering ensures it's perfectly centered.
        const box = new THREE.Box3().setFromObject(logoGroup);
        const center = box.getCenter(new THREE.Vector3());
        logoGroup.position.sub(center); // Adjust the group's position to move its new center to origin
        // Note: We don't re-apply the original 'center.multiplyScalar(scale)' from centerAndScaleObject
        // because that was for the pre-flip centering. We just want to nullify the current center.

        scene.add(logoGroup);
      }

      function createRaindropGeometryAndSystem() {
        const loader = new SVGLoader();
        const parsedRaindropSVG = loader.parse(raindropSvgData);

        const extrudeSettings = {
          depth: 0.5, // Raindrops can be thinner
          bevelEnabled: true,
          bevelSegments: 1,
          steps: 1,
          bevelSize: 0.05,
          bevelThickness: 0.05,
        };

        // Create the geometry for the raindrop ONCE
        const path = parsedRaindropSVG.paths[0]; // Assuming one path for the raindrop
        if (path) {
          const shapes = SVGLoader.createShapes(path);
          if (shapes.length > 0) {
            sharedRaindropGeometry = new THREE.ExtrudeGeometry(
              shapes[0],
              extrudeSettings
            );
            sharedRaindropGeometry.computeVertexNormals();
            centerAndScaleObject(
              new THREE.Mesh(sharedRaindropGeometry),
              1.5,
              true
            ); // Center and scale the geometry itself
          }
        }

        if (!sharedRaindropGeometry) {
          console.error("Failed to create raindrop geometry.");
          return;
        }

        // Create raindrop instances
        for (let i = 0; i < numRaindrops; i++) {
          const raindrop = new THREE.Mesh(
            sharedRaindropGeometry,
            sharedRaindropMaterial
          );
          resetRaindrop(raindrop);
          raindrop.rotation.x = Math.random() * Math.PI * 2; // Random initial rotation
          raindrop.rotation.y = Math.random() * Math.PI * 2;
          raindrops.push(raindrop);
          scene.add(raindrop);
        }
      }

      function resetRaindrop(raindrop) {
        raindrop.position.x = (Math.random() - 0.5) * rainArea.width;
        raindrop.position.y = rainArea.topY + Math.random() * 20; // Start slightly above top
        raindrop.position.z = (Math.random() - 0.5) * rainArea.depth;
        raindrop.userData.velocityY = -(Math.random() * 0.1 + 0.05); // Random falling speed
        raindrop.userData.rotationSpeedX = (Math.random() - 0.5) * 0.02;
        raindrop.userData.rotationSpeedY = (Math.random() - 0.5) * 0.02;
      }

      function centerAndScaleObject(
        object,
        desiredSize,
        centerGeometry = false
      ) {
        let box;
        let initialCenter;

        if (centerGeometry && object.geometry) {
          // Center and scale the geometry itself
          object.geometry.computeBoundingBox();
          box = object.geometry.boundingBox.clone();
          initialCenter = box.getCenter(new THREE.Vector3()).clone(); // Store initial center of geometry

          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          let scale = 1;
          if (maxDim > 0 && desiredSize > 0) {
            scale = desiredSize / maxDim;
          }

          // Translate geometry vertices to be centered around (0,0,0) THEN scale
          object.geometry.translate(
            -initialCenter.x,
            -initialCenter.y,
            -initialCenter.z
          );
          object.geometry.scale(scale, scale, scale);
          // Y-flip for SVG geometry is tricky here as it might need to happen before centering.
          // For raindrops, their inherent shape from the SVG path might already be okay,
          // or the random rotation makes it less noticeable.
          // If raindrops are consistently upside down, you might scale geometry.y by -scale.
        } else {
          // Center and scale the Object3D (Group or Mesh)
          box = new THREE.Box3().setFromObject(object);
          initialCenter = box.getCenter(new THREE.Vector3()).clone(); // Store initial center of object
          const size = box.getSize(new THREE.Vector3());

          // Calculate scale based on the object's current dimensions
          const maxDim = Math.max(size.x, size.y, size.z); // Use current max dimension
          let scaleFactor = 1;
          if (maxDim > 0 && desiredSize > 0) {
            scaleFactor = desiredSize / maxDim;
          }

          object.scale.set(scaleFactor, scaleFactor, scaleFactor); // Apply uniform scale

          // After scaling, get the new center and translate to origin
          // This needs to happen *after* the Y-flip for the main logo for true centering
          // So, we'll let the calling function (loadMainLogo) handle final centering after flip.
          // For now, just apply the translation based on the initial center and scale.
          object.position.sub(initialCenter.multiplyScalar(scaleFactor));
        }
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        if (bloomPass) {
          // Check if bloomPass is defined
          bloomPass.resolution.set(window.innerWidth, window.innerHeight);
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        // Animate raindrops
        raindrops.forEach((raindrop) => {
          raindrop.position.y += raindrop.userData.velocityY;
          raindrop.rotation.x += raindrop.userData.rotationSpeedX;
          raindrop.rotation.y += raindrop.userData.rotationSpeedY;
          if (raindrop.position.y < rainArea.bottomY) {
            resetRaindrop(raindrop);
          }
        });

        controls.update();
        composer.render();
      }
    </script>
  </body>
</html>
